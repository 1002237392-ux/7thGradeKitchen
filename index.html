<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتيب وصفات السابع ج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            margin: 0; padding: 0;
        }

        /* رأس الصفحة */
        .header {
            text-align: center;
            padding: 30px;
            background: white;
            border-bottom: 8px solid #ffbe0b; /* لون ذهبي دافئ */
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .logo { max-width: 100px; margin-bottom: 10px; }
        .title { font-size: 2.2em; color: #2d3436; margin: 10px 0; }
        .message { font-size: 1.1em; color: #636e72; line-height: 1.6; max-width: 700px; margin: auto; font-style: italic; }
        .signature { display: block; margin-top: 10px; font-weight: bold; color: #d63031; }

        /* حاوية الأزرار - ألوان قوس قزح */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .recipe-btn {
            width: 220px;
            height: 120px;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .recipe-btn:hover { transform: scale(1.08); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .recipe-btn .v-name { font-size: 1.3em; margin-bottom: 5px; }
        .recipe-btn .s-name { font-size: 0.9em; opacity: 0.9; font-weight: normal; }

        /* توزيع ألوان قوس قزح على الأزرار بالترتيب */
        .recipe-btn:nth-child(6n+1) { background: #ff595e; } /* أحمر */
        .recipe-btn:nth-child(6n+2) { background: #ffca3a; } /* أصفر/برتقالي */
        .recipe-btn:nth-child(6n+3) { background: #8ac926; } /* أخضر */
        .recipe-btn:nth-child(6n+4) { background: #1982c4; } /* أزرق */
        .recipe-btn:nth-child(6n+5) { background: #6a4c93; } /* بنفسجي */
        .recipe-btn:nth-child(6n+6) { background: #ff924c; } /* برتقالي غامق */

        /* النافذة المنبثقة */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; margin: 5vh auto; padding: 25px; border-radius: 25px;
            width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; position: relative;
        }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 30px; cursor: pointer; color: #636e72; }
        .recipe-img { width: 100%; height: 350px; object-fit: cover; border-radius: 20px; margin-bottom: 15px; }
        .modal-title { color: #2d3436; text-align: center; font-size: 1.8em; margin: 10px 0; }
        .details-box { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-around; font-size: 0.9em; }
        .section-h { border-right: 4px solid #ffca3a; padding-right: 10px; color: #1982c4; margin-top: 20px; }
        .text-p { line-height: 1.8; white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.postimg.cc/26jnR4Q1/sml-byt-hspr.png" class="logo">
        <h1 class="title">من قلب بيوتنا لقلب صفنا: عيلة السابع ج بتطبخ سوا</h1>
        <p class="message">
            "بين ثنايا هذه الوصفات، نكهة حب لا تنتهي.. فخورة بأنني بينكم، أجمع نكهات إبداعكم لنبقى دوماً عائلة السابع ج القريبة من القلب."
            <span class="signature">— محبتكم: منى مصطفى</span>
        </p>
    </div>

    <div class="container" id="buttons-grid"></div>

    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="mImg" class="recipe-img" src="" onerror="this.src='https://via.placeholder.com/400x300?text=جاري+تحميل+الصورة...'">
            <h2 id="mTitle" class="modal-title"></h2>
            <div class="details-box">
                <span>👤 الطالب: <b id="mStudent"></b></span>
                <span>📂 الفئة: <b id="mCat"></b></span>
                <span>🏠 المصدر: <b id="mSrc"></b></span>
            </div>
            <h3 class="section-h">المكونات</h3>
            <div id="mIng" class="text-p"></div>
            <h3 class="section-h">طريقة التحضير</h3>
            <div id="mPrep" class="text-p"></div>
        </div>
    </div>

    <script>
        const recipes = [
            {
                student: "منى مصطفى",
                title: "كيكة التيراليتشي",
                cat: "حلوى",
                src: "صديقة",
                ing: "٤ بيض، كاس سكر، كاس ونص طحين، بيكنج باودر، فانيل.\nللتقطير: لتر حليب، كريمة، سكر.\nللوجه: كراميل جاهز.",
                prep: "1. نخفق البيض والسكر.\n2. نضيف الطحين ونخبز على 180 درجة.\n3. نشربها بالحليب وهي ساخنة.\n4. نضع الكريمة ثم الكراميل.",
                // تم تعديل الرابط ليعمل مباشرة
                img: "https://drive.google.com/uc?export=view&id=1TAa_dPqSfwj4V1pWI2NXPX6dkUvYZZxU"
            }
        ];

        const grid = document.getElementById('buttons-grid');
        recipes.forEach((r, i) => {
            const b = document.createElement('button');
            b.className = 'recipe-btn';
            b.innerHTML = `<span class="v-name">${r.title}</span><span class="s-name">إعداد: ${r.student}</span>`;
            b.onclick = () => {
                document.getElementById('mTitle').innerText = r.title;
                document.getElementById('mStudent').innerText = r.student;
                document.getElementById('mCat').innerText = r.cat;
                document.getElementById('mSrc').innerText = r.src;
                document.getElementById('mIng').innerText = r.ing;
                document.getElementById('mPrep').innerText = r.prep;
                document.getElementById('mImg').src = r.img;
                document.getElementById('recipeModal').style.display = 'block';
            };
            grid.appendChild(b);
        });

        function closeModal() { document.getElementById('recipeModal').style.display = 'none'; }
        window.onclick = (e) => { if(e.target.className == 'modal') closeModal(); }
    </script>
</body>
</html>
